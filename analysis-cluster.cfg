# KataGo analysis config tuned for a shared GPU cluster node.
#
# Key difference from analysis.cfg: finalize.py pipelines many independent
# queries, so the engine should search several at once and batch their NN
# evaluations together.  Total CPU threads = numAnalysisThreads *
# numSearchThreads, so keep their product near your --cpus-per-task
# allocation (here 8 * 4 = 32 threads for a 16-core request; search threads
# spend most of their time waiting on the GPU, so ~2x oversubscription is
# fine).
#
# finalize.py overrides numAnalysisThreads via -override-config, so
# --analysis-threads on the command line wins over the value below.

logAllRequests = false
logAllResponses = false
logSearchInfo = false
logDir = analysis_logs

# how many queries are searched concurrently (overridden by
# finalize.py --analysis-threads)
numAnalysisThreads = 8

# threads per individual search; low, because there are many searches
numSearchThreads = 4

# must be >= numAnalysisThreads * numSearchThreads for the NN batch to
# actually fill up; a too-small value silently caps throughput
nnMaxBatchSize = 64

# bigger cache pays off when many queries share the same base position
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 17

# ownership must be reported from Black's perspective; the client also
# calibrates at startup, but pinning it avoids any ambiguity
reportAnalysisWinratesAs = BLACK

# hard ceiling; the actual visit counts come from the command line
maxVisits = 10000
