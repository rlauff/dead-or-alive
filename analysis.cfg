# KataGo analysis engine config for tsumego-factory.
# Start from this; katago's own analysis_example.cfg documents every key.

logDir = analysis_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false

# One request at a time (the generator is strictly sequential), but give that
# request plenty of search threads so the GPU stays busy.  Raise
# numSearchThreadsPerAnalysisThread until `katago benchmark` stops improving.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 16

# GPU batching / cache. Raise nnMaxBatchSize if the GPU is underutilized,
# lower it if you run out of VRAM.
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 17

# All reported values (winrates, ownership, per-move ownership) follow this
# perspective. BLACK keeps the generator's math trivial; it auto-calibrates
# at startup anyway, so SIDETOMOVE/WHITE would also work if you must reuse an
# existing config.
reportAnalysisWinratesAs = BLACK

# Hard ceiling; the generator sets per-query maxVisits well below this.
maxVisits = 5000
